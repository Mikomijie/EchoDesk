<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>EchoDesk - Speech Test</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0A1930;
    color: white;
    text-align: center;
    padding: 40px;
  }
  button {
    padding: 15px 30px;
    font-size: 18px;
    border-radius: 8px;
    border: none;
    background: #D4A94C;
    color: #0A1930;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 30px;
  }
  #output {
    font-size: 24px;
    line-height: 1.6;
    max-width: 700px;
    margin: 0 auto;
    background: #12233f;
    padding: 20px;
    border-radius: 10px;
    min-height: 200px;
    text-align: left;
  }
</style>
</head>
<body>

  <h1>EchoDesk - Speech Test</h1>
  <button id="startBtn">Start Listening</button>
  <div id="output">Text will appear here...</div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      output.innerText = "Speech recognition not supported. Please use Google Chrome.";
    } else {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'en-US';

      let finalTranscript = '';

      recognition.onresult = (event) => {
        let interimTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) {
            finalTranscript += transcript + ' ';
          } else {
            interimTranscript += transcript;
          }
        }
        output.innerHTML = finalTranscript + '<span style="color:#888">' + interimTranscript + '</span>';
      };

      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
      };

      recognition.onend = () => {
        recognition.start();
      };

      startBtn.addEventListener('click', () => {
        finalTranscript = '';
        output.innerText = 'Listening...';
        recognition.start();
      });
    }
  </script>

</body>
</html>
